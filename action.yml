name: 'Manjaro Iso Action'
description: 'Installs prerequisites for building Manjaro on ubuntu'

inputs:
  iso-profiles-repo:
    description: 'iso profiles to clone'
    required: false
    default: 'https://github.com/manjaro-contrib/profiles-and-settings-iso-profiles'
  iso-profiles-branch:
    description: 'branch of the iso profiles to check out'
    required: false
  edition:
    description: 'name of the iso profile to build'
    required: true
  branch:
    description: 'stable (default), testing, unstable'
    required: false
    default: stable
  scope:
    description: 'full (default) or minimal image'
    required: false
    default: full
  version:
    description: 'dist_release version (upstream if not given)'
    required: false
  kernel:
    description: 'kernel version'
    required: false
    default: linux510
  code-name:
    description: 'manjaro code-name (upstream if not given)'
    required: false
  release-tag:
    description: 'release tag to upload to (if set)'
    required: false
  custom-repo:
    description: 'name a custom repo to be prioritized above the default ones'
    required: false
  office-chooser:
    description: 'include calamares office installer module'
    required: false
    default: "false"
  build-mirror:
    description: 'specific build mirror to use'
    required: false
    default: https://mirror.easyname.at/manjaro
  gpg-secret-key-base64:
    description: 'base64 encoded gpg secret key (without a passphrase) to sign the zip (if set)'
    required: false
  gpg-passphrase:
    description: 'phrase to decrypt the gpg secret key if given'
    required: false
  additional-trusted-gpg:
    description: 'gpg keyids that pacman should trust'
    required: false
  chroot-nameservers:
    description: 'space-separated resolvers to write into the build chroots'
    required: false
    default: '1.1.1.1 8.8.8.8'
  r2-endpoint:
    description: 's3 endpoint to upload the unsplit iso to (skipped if unset)'
    required: false
  r2-access-key-id:
    description: 's3 access key id'
    required: false
  r2-secret-access-key:
    description: 's3 secret access key'
    required: false
  r2-bucket:
    description: 's3 bucket to upload the iso into'
    required: false
  r2-prefix:
    description: 'key prefix inside the bucket, e.g. rc-202601010000/'
    required: false
    default: ''

outputs:
  file-path:
    description: "path of the generated iso"
    value: ${{ steps.image-build.outputs.file-path }}

runs:
  using: "composite"
  steps:
    - id: install-build-dependencies
      shell: bash
      run: |
        sudo apt-add-repository -y universe
        sudo apt-get update
        sudo apt-get install \
          xorriso \
          gdisk \
          zip \
          systemd-container \
          bmap-tools \
          asciidoc \
          libarchive-tools \
          git \
          build-essential \
          cmake \
          libarchive-dev \
          pkg-config \
          libcurl4-openssl-dev \
          libgpgme-dev \
          libssl-dev \
          fakeroot \
          dh-autoreconf \
          haveged \
          os-prober \
          kwalify \
          dosfstools \
          libisoburn1 \
          squashfs-tools \
          docbook2x \
          mktorrent \
          doxygen \
          zstd \
          s3cmd
        sudo python3 -m pip install meson
        sudo python3 -m pip install ninja
    - id: cache-pacman
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          /tmp/pacman-stage
          /tmp/pacman-configs
        key: pacman-7.1.0-contrib-${{ runner.os }}-${{ runner.arch }}-v1
    - id: install-pacman
      shell: bash
      env:
        PACMAN_VERSION: 7.1.0
      run: |
        set -euo pipefail
        if [ -d /tmp/pacman-stage/usr ]; then
          echo "## pacman ${PACMAN_VERSION}: restoring from cache"
          sudo cp -a /tmp/pacman-stage/. /
          sudo install -m644 /tmp/pacman-configs/pacman.conf /etc/pacman.conf
          sudo install -m644 /tmp/pacman-configs/makepkg.conf /etc/
        else
          echo "## pacman ${PACMAN_VERSION}: source build"
          sudo git clone --depth 1 https://github.com/manjaro-contrib/packages-core-pacman.git pacman
          pushd pacman
            sudo wget https://gitlab.archlinux.org/pacman/pacman/-/archive/v${PACMAN_VERSION}/pacman-v${PACMAN_VERSION}.tar.gz
            sudo tar -xvf pacman-v${PACMAN_VERSION}.tar.gz
            pushd pacman-v${PACMAN_VERSION}
              sudo meson --prefix=/usr \
                        --buildtype=plain \
                        -Ddoc=disabled \
                        -Ddoxygen=enabled \
                        -Dscriptlet-shell=/usr/bin/bash \
                        -Dldconfig=/usr/bin/ldconfig \
                        build
              sudo meson compile -C build
              # Stage install for caching; then propagate to / for this run.
              sudo meson install -C build --destdir /tmp/pacman-stage
              sudo cp -a /tmp/pacman-stage/. /
            popd
            sudo mkdir -p /tmp/pacman-configs
            sudo cp pacman.conf makepkg.conf /tmp/pacman-configs/
            sudo install -m644 pacman.conf /etc/pacman.conf
            sudo install -m644 makepkg.conf /etc/
          popd
          # pacman-contrib provides paccache, used by callers to prune the
          # /var/cache/pacman/pkg cache between runs. Autotools-based, not
          # meson — needs autogen.sh first.
          echo "## pacman-contrib: source build"
          sudo git clone --depth 1 https://gitlab.archlinux.org/pacman/pacman-contrib.git
          pushd pacman-contrib
            sudo ./autogen.sh
            sudo ./configure --prefix=/usr --disable-doc
            sudo make
            sudo make DESTDIR=/tmp/pacman-stage install
            sudo cp -a /tmp/pacman-stage/. /
          popd
        fi
        # System user, /etc/pacman.d, and mirrorlist aren't cached — runtime
        # state, cheap to (re-)create.
        id alpm >/dev/null 2>&1 || sudo useradd --system --no-create-home --shell /usr/sbin/nologin alpm
        sudo mkdir -p /etc/pacman.d
        sudo touch /etc/pacman.d/mirrorlist
    - id: install-keyrings
      shell: bash
      run: |
        sudo install -dm755 /usr/share/pacman/keyrings/

        sudo git clone --depth 1 https://github.com/manjaro-contrib/packages-core-manjaro-keyring.git manjaro-keyring
        pushd manjaro-keyring
          sudo install -m0644 manjaro.gpg /usr/share/pacman/keyrings/
          sudo install -m0644 manjaro-trusted /usr/share/pacman/keyrings/
          sudo install -m0644 manjaro-revoked /usr/share/pacman/keyrings/
        popd

        mkdir -p archlinux-keyring
        pushd archlinux-keyring
          wget https://archlinux.org/packages/core/any/archlinux-keyring/download -O /tmp/archlinux-keyring.tar.zst
          tar --use-compress-program=unzstd --strip-components=4 --wildcards -xvf /tmp/archlinux-keyring.tar.zst usr/share/pacman/keyrings/*
          sudo install -m0644 archlinux.gpg /usr/share/pacman/keyrings/
          sudo install -m0644 archlinux-trusted /usr/share/pacman/keyrings/
          sudo install -m0644 archlinux-revoked /usr/share/pacman/keyrings/
        popd

        sudo pacman-key --init
        sudo pacman-key --populate archlinux manjaro

        for gpg_key in ${{ inputs.additional-trusted-gpg }}; do
          sudo pacman-key --keyserver keys.openpgp.org --recv-key $gpg_key
          sudo pacman-key --lsign-key $gpg_key
        done
    - id: install-arch-install-scripts
      shell: bash
      env:
        VERSION: "27"
      run: |
        sudo wget https://github.com/archlinux/arch-install-scripts/archive/refs/tags/v${VERSION}.tar.gz -O arch-install-scripts.tar.gz
        sudo tar -xvf arch-install-scripts.tar.gz
        sudo make -C arch-install-scripts-${VERSION}
        sudo make -C arch-install-scripts-${VERSION} check
        sudo make -C arch-install-scripts-${VERSION} PREFIX=/usr install
        
        sudo wget https://raw.githubusercontent.com/manjaro-contrib/applications-pacman-mirrors/master/data/etc/pacman-mirrors.conf -O /etc/pacman-mirrors.conf
    - id: install-calamares-tools
      shell: bash
      run: |
        sudo git clone --depth 1 https://github.com/manjaro-contrib/applications-calamares-tools.git calamares-tools
        
        cd calamares-tools
        sudo install -d /usr/share/calamares/
        sudo cp -rv schemas/ /usr/share/calamares/
    - id: install-mkinitcpio
      shell: bash
      env:
        VERSION: "32"
      run: |
        sudo wget https://gitlab.archlinux.org/archlinux/mkinitcpio/mkinitcpio/-/archive/v${VERSION}/mkinitcpio-v${VERSION}.tar.gz
        sudo tar -xf mkinitcpio-v${VERSION}.tar.gz
        sudo make -C mkinitcpio-v${VERSION} install
        sudo sed -i -e 's|File|Path|' /usr/share/libalpm/hooks/*hook
    - id: install-manjaro-tools
      shell: bash
      env:
        CUSTOM_REPO: ${{ inputs.custom-repo }}
      run: |
        sudo git clone --depth 1 https://github.com/manjaro-contrib/tools-development-tools-manjaro-tools.git manjaro-tools
        cd manjaro-tools
        sudo make SYSCONFDIR=/etc PREFIX=/usr
        sudo make SYSCONFDIR=/etc PREFIX=/usr install_base
        sudo make SYSCONFDIR=/etc PREFIX=/usr install_yaml
        sudo make SYSCONFDIR=/etc PREFIX=/usr install_iso
        if [ ! -z ${CUSTOM_REPO} ]; then
          echo "## adding repo [${CUSTOM_REPO}]"
          sudo sed -i -e "s/\[core\]/\[${CUSTOM_REPO}\]\nSigLevel = PackageRequired\nInclude = \/etc\/pacman\.d\/mirrorlist\n\n\[core\]/" /usr/share/manjaro-tools/pacman-multilib.conf
        fi
    - id: checkout-iso-profiles
      shell: bash
      env:
        REPO: ${{ inputs.iso-profiles-repo }}
        BRANCH: ${{ inputs.iso-profiles-branch }}
      run: sudo git clone ${BRANCH:+--branch ${BRANCH}} --depth 1 ${REPO} iso-profiles
    - id: cleanup_space_workaround
      shell: bash
      run: |
        sudo apt-get clean
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
    - id: image-build
      shell: bash
      env:
        EDITION: ${{ inputs.edition }}
        BRANCH: ${{ inputs.branch }}
        SCOPE: ${{ inputs.scope }}
        VERSION: ${{ inputs.version }}
        KERNEL: ${{ inputs.kernel }}
        CODE_NAME: ${{ inputs.code-name }}
        OFFICE: ${{ inputs.office-chooser }}
        BUILD_MIRROR: ${{ inputs.build-mirror }}
        CHROOT_NAMESERVERS: ${{ inputs.chroot-nameservers }}
      run: |
        echo "## building iso"
        [ "$SCOPE" == "minimal" ] && unset SCOPE && unset OFFICE
        [ "$OFFICE" == "false" ] && unset OFFICE

        # source the version info from current release info
        source <(curl -s https://raw.githubusercontent.com/manjaro-contrib/packages-core-manjaro-release/master/lsb-release)

        sudo sed -i -e "s|dist_name=\$(get_distname)|dist_name=${DISTRIB_ID%Linux}|g" /usr/lib/manjaro-tools/util.sh
        sudo sed -i -e 's|iso_name=$(get_osid)|iso_name=manjaro|g' /usr/lib/manjaro-tools/util.sh
        sudo sed -i -e "s|dist_release=\$(get_release)|dist_release=${VERSION:-$DISTRIB_RELEASE}|g" /usr/lib/manjaro-tools/util.sh
        sudo sed -i -e "s|dist_codename=\$(get_codename)|dist_codename=\"${CODE_NAME:-$DISTRIB_CODENAME}\"|g" /usr/lib/manjaro-tools/util.sh
        sudo sed -i -e "s|build_mirror='https://mirror.easyname.at/manjaro'|build_mirror=\'${BUILD_MIRROR}\'|g" /usr/lib/manjaro-tools/util.sh
        
        # the chroots inherit no resolver; see the script for why
        sudo --preserve-env=CHROOT_NAMESERVERS \
          bash "$GITHUB_ACTION_PATH/scripts/enable-chroot-dns.sh"

        sudo buildiso ${SCOPE:+-f} -p $EDITION -b $BRANCH -k $KERNEL ${OFFICE:+-o}

        sudo rm -Rf /var/lib/manjaro-tools/buildiso/*
        
        OUTPUT_ISO_PATH=$(find /var/cache/manjaro-tools/iso -type f -name "*.iso" -exec stat -c '%Y %n' {} \; | sort -nr | awk 'NR==1 {print $2}')
        TARGET_ISO_PATH=$(basename $OUTPUT_ISO_PATH)
        mv $OUTPUT_ISO_PATH ./$TARGET_ISO_PATH
        echo "file-path=$TARGET_ISO_PATH" >> $GITHUB_OUTPUT

        FILE_PKG=$(find /var/cache/manjaro-tools/iso -type f -name "*-pkgs.txt" -exec stat -c '%Y %n' {} \; | sort -nr | awk 'NR==1 {print $2}')
        mv $FILE_PKG ./${TARGET_ISO_PATH}.pkgs
    - id: hash
      shell: bash
      run: |
        echo "## calculating hashes"
        sha1sum ${{ steps.image-build.outputs.file-path }} >${{ steps.image-build.outputs.file-path }}.sha1
        sha256sum ${{ steps.image-build.outputs.file-path }} >${{ steps.image-build.outputs.file-path }}.sha256
        sha512sum ${{ steps.image-build.outputs.file-path }} >${{ steps.image-build.outputs.file-path }}.sha512
    - id: gpg_sign
      shell: bash
      run: |
        # if is not yet supported in composite https://github.com/actions/runner/blob/main/docs/adrs/0549-composite-run-steps.md#if-condition
        if [ -z "${{ inputs.gpg-secret-key-base64 }}" ]; then 
          echo "## no gpg secret given"
          exit 0
        fi
        echo "## gpg signing"
        cat <(echo -e "${{ inputs.gpg-secret-key-base64 }}" | base64 --decode) | gpg --batch --import &>/dev/null
        gpg --pinentry-mode loopback --passphrase "${{ inputs.gpg-passphrase }}" --detach-sign ./${{ steps.image-build.outputs.file-path }}
    - id: upload-prepare
      shell: bash -O extglob {0}
      run: |
        echo "## ssh setup"
        mkdir -p /home/runner/.ssh
        touch /home/runner/.ssh/github_actions
        chmod 600 /home/runner/.ssh/github_actions
        ssh-agent -a /tmp/ssh_agent.sock > /dev/null
        echo "upload-files=./${{ steps.image-build.outputs.file-path }}+(|.sha*|.pkgs|.sig|.torrent)" >> $GITHUB_OUTPUT
        mkdir -p ${{ inputs.edition }}/${{ inputs.version }}
    - id: upload-object-storage
      shell: bash
      env:
        R2_ENDPOINT: ${{ inputs.r2-endpoint }}
        R2_ACCESS_KEY_ID: ${{ inputs.r2-access-key-id }}
        R2_SECRET_ACCESS_KEY: ${{ inputs.r2-secret-access-key }}
        R2_BUCKET: ${{ inputs.r2-bucket }}
        R2_PREFIX: ${{ inputs.r2-prefix }}
        ISO: ${{ steps.image-build.outputs.file-path }}
      run: |
        # if is not yet supported in composite https://github.com/actions/runner/blob/main/docs/adrs/0549-composite-run-steps.md#if-condition
        if [ -z "$R2_ENDPOINT" ] || [ -z "$R2_BUCKET" ]; then
          echo "## no object storage configured"
          exit 0
        fi
        echo "## uploading the unsplit iso"
        # runs before the split-zip below: github caps an asset at 2 GB, so
        # the release can only ever carry the parts, while object storage
        # takes the image itself and serves it without reassembly
        python3 -m pip install --quiet boto3
        python3 - <<'EOF'
        import os

        import boto3
        from boto3.s3.transfer import TransferConfig
        from botocore.exceptions import BotoCoreError, ClientError

        iso = os.environ["ISO"]
        key = os.environ.get("R2_PREFIX", "") + iso
        s3 = boto3.client(
            "s3",
            endpoint_url=os.environ["R2_ENDPOINT"],
            aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
            aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
            region_name="auto",
        )
        # images run to several gigabytes; a larger part keeps the count sane
        config = TransferConfig(multipart_chunksize=64 * 1024 * 1024)
        size = os.path.getsize(iso)
        print(f"{iso}: {size / 1e9:.2f} GB -> {key}")
        bucket = os.environ["R2_BUCKET"]
        s3.upload_file(iso, bucket, key, Config=config)
        head = s3.head_object(Bucket=bucket, Key=key)
        if head["ContentLength"] != size:
            # a truncated object would satisfy a later existence check
            s3.delete_object(Bucket=bucket, Key=key)
            raise SystemExit(f"{iso}: uploaded {head['ContentLength']} of {size}")
        print(f"{iso}: published")

        # an image whose signature or checksum is missing cannot be
        # verified, and the stable alias would point at it regardless. So
        # the set is all-or-nothing: anything already uploaded is removed
        # if a later part fails, leaving the previous build in place.
        written = [key]
        try:
            for suffix in (".sig", ".sha1", ".sha256", ".sha512", ".pkgs"):
                if not os.path.exists(iso + suffix):
                    continue
                s3.upload_file(iso + suffix, bucket, key + suffix)
                written.append(key + suffix)
                print(f"{iso}{suffix}: published")
        except (OSError, BotoCoreError, ClientError) as e:
            print(f"{iso}: rolling back {len(written)} object(s): {e}")
            for done in written:
                try:
                    s3.delete_object(Bucket=bucket, Key=done)
                except (BotoCoreError, ClientError) as cleanup:
                    # report it: a partial set left behind is what this
                    # whole block exists to prevent
                    print(f"{iso}: could not remove {done}: {cleanup}")
            raise
        EOF
    - id: upload-github-release
      shell: bash -O extglob {0}
      env:
        LIMIT_MB: '2000'
      run: |
        # if is not yet supported in composite https://github.com/actions/runner/blob/main/docs/adrs/0549-composite-run-steps.md#if-condition
        if [ -z "${{ inputs.release-tag }}" ]; then 
          echo "## no release tag given"
          exit 0
        fi
        echo "## github upload"

        echo ${{ github.token }} | gh auth login --with-token
        gh release create ${{ inputs.release-tag }} --title ${{ inputs.release-tag }} --repo ${{ github.repository }} --notes "automated release" --prerelease || echo "release already exists"

        if [[ -z "$(du --threshold=${LIMIT_MB}M ${{ steps.image-build.outputs.file-path }})" ]]; then
          # iso is small enough to upload already
          gh release upload ${{ inputs.release-tag }} --repo ${{ github.repository }} --clobber \
            ${{ steps.upload-prepare.outputs.upload-files }}
        else
          # iso is too big - creating a split-zip
          zip -j -s ${LIMIT_MB}m ${{ steps.image-build.outputs.file-path }}.zip ${{ steps.image-build.outputs.file-path }}

          gh release upload ${{ inputs.release-tag }} --repo ${{ github.repository }} --clobber \
            ./${{ steps.image-build.outputs.file-path }}+(.z*|.sha*|.pkgs|.sig|.torrent)
        fi
  
